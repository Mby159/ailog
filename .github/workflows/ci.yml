name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # The full suite. This used to be a single module (`tests.test_localchain_bridge`)
  # out of 15, which is how a broken `ailog search` fallback and three undeclared
  # dependencies survived in a repo with 13 test files.
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev extra carries what the suite needs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Full test suite
        run: python -m pytest tests/ -q --tb=short

  # Keeps the real Node LocalChain round trip in the loop.
  bridge:
    name: ailog <-> localchain bridge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout ailog
        uses: actions/checkout@v4
        with:
          path: ailog

      - name: Checkout local-chain (sibling)
        uses: actions/checkout@v4
        with:
          repository: Mby159/local-chain
          path: local-chain

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bridge tests
        working-directory: ailog
        env:
          LOCAL_CHAIN_REPO: ${{ github.workspace }}/local-chain
        run: python -m unittest tests.test_localchain_bridge -v

  # Guards the packaging promises, not just the code.
  package:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The core install must need nothing but the standard library
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/python -m pip install --quiet --upgrade pip
          /tmp/core/bin/python -m pip install --quiet dist/*.whl
          /tmp/core/bin/python -c "import importlib.metadata as m; r=[x for x in (m.requires('ailog') or []) if 'extra ==' not in x]; print('hard requirements:', r); assert r == [], r"
          /tmp/core/bin/ailog --help > /dev/null
          echo "CLI runs on a bare install"

      - name: Optional extras must resolve
        run: |
          for extra in pdf notion youtube mcp privacy search; do
            echo "--- extra: $extra"
            python -m pip install --quiet --dry-run "dist/$(ls dist | grep '\.whl$')[$extra]"
          done