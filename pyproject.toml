[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailog"
version = "0.1.0"
description = "Platform-agnostic open format for AI interaction artifacts — 个人AI对话数据主权开放协议"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["ai", "chat", "conversation", "export", "privacy", "data-sovereignty", "open-format"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Utilities",
]

# No hard dependencies: the core format, importers, exporters and the CLI are
# standard library only. PDF, Notion, MCP, YouTube and semantic search each pull
# their own optional extra -- see [project.optional-dependencies].
dependencies = []

[project.urls]
Homepage = "https://github.com/Mby159/ailog"
Repository = "https://github.com/Mby159/ailog"
Issues = "https://github.com/Mby159/ailog/issues"

[project.optional-dependencies]
# Exporters
pdf = ["fpdf2>=2.7.0"]
notion = ["notion-client>=3.0.0"]

# Importers
youtube = ["youtube-transcript-api>=0.6"]

# Integrations
mcp = ["mcp>=0.9.0"]
privacy = ["ghostguard>=0.1.0"]

# Semantic search. numpy + scikit-learn + faiss-cpu is the minimum that makes
# `ailog search` work at all; scikit-learn is the offline TF-IDF backend.
search = ["numpy>=1.20", "scikit-learn>=1.3", "faiss-cpu>=1.7"]

# Same, plus the higher-quality sentence-transformers embedding backend, which
# `ailog.search.engine` prefers when it is importable.
search-embeddings = [
    "numpy>=1.20",
    "scikit-learn>=1.3",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
]

# Everything needed to run `pytest tests/` to completion.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "notion-client>=3.0.0",
    "numpy>=1.20",
    "scikit-learn>=1.3",
    "faiss-cpu>=1.7",
]

all = [
    "ailog[pdf,notion,youtube,mcp,privacy,search,dev]",
]

[project.scripts]
ailog = "ailog.cli:main"
ailog-mcp = "ailog.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ailog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
